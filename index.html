<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SORACOM UG Explorer 2026 ハンズオン リンク集</title>
  <meta name="description" content="SORACOM UG Explorer 2026 で実施する各ハンズオンの手順書・リポジトリへのリンク集です。">
  <meta property="og:title" content="SORACOM UG Explorer 2026 ハンズオン リンク集">
  <meta property="og:description" content="SORACOM UG Explorer 2026 で実施する各ハンズオンの手順書・リポジトリへのリンク集です。">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="eyebrow">SORACOM UG Explorer 2026</p>
      <h1>ハンズオン リンク集</h1>
      <p class="lead">参加するハンズオンの「手順書を開く」から始めてください。</p>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <label class="search">
        <span class="visually-hidden">ハンズオンを検索</span>
        <input id="search" type="search" placeholder="キーワードで絞り込み（例: Flux, GPS）" autocomplete="off">
      </label>
      <p id="count" class="count" aria-live="polite"></p>
    </div>

    <ul id="list" class="cards"></ul>

    <noscript>
      <p>JavaScript を有効にしてください。各ハンズオンは
        <a href="https://github.com/orgs/soracomug/repositories?q=explorer2026-hands-on">soracomug の GitHub</a>
        からも参照できます。</p>
    </noscript>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>
        <a href="https://github.com/soracomug">SORACOM UG (GitHub)</a> ·
        <a href="https://github.com/soracomug/explorer2026-hands-on-links">このページのリポジトリ</a>
      </p>
    </div>
  </footer>

  <script src="assets/links.js"></script>
  <script src="assets/main.js"></script>
</body>
</html>
